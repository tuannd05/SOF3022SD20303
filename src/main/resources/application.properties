spring.application.name=OnTap_SOF3022
# --KET_NOI CSDL--
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SP26_SD20303;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=YourPassword!123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
# --JPA--
#chay 1 lan cho tu dong create cac cot co trong entity ma khong co trong database (none => create)
#chay nhieu lan thi tu dong create lai tu dau => mat het cac du lieu cua cac cot trong database (create => none)
#dong 5 khong tu dong dat ten bang, ten cot trong database => dat theo ten bang, ten cot trong entity co anh xa toi csdl dang ket noi
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
